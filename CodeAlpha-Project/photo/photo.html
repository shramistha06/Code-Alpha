<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery</title>

<style>
    :root {
        --bg-main: #0f172a;
        --card-bg: #1e293b;
        --accent: #38bdf8;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1e293b, #020617);
        font-family: "Segoe UI", sans-serif;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .vault {
        width: 90%;
        max-width: 1100px;
    }

    .vault h1 {
        text-align: center;
        margin-bottom: 30px;
        letter-spacing: 2px;
        color: var(--accent);
    }

    .frame-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
    }

    .frame {
        background: var(--card-bg);
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .frame:hover {
        transform: translateY(-6px) scale(1.03);
        box-shadow: 0 20px 40px rgba(56,189,248,0.25);
    }

    .frame img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        filter: grayscale(20%);
        transition: filter 0.4s ease;
    }

    .frame:hover img {
        filter: grayscale(0%);
    }

    .tag {
        position: absolute;
        bottom: 8px;
        left: 10px;
        background: rgba(0,0,0,0.6);
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 13px;
        color: #e5e7eb;
    }

    /* Lightbox */
    .viewer {
        position: fixed;
        inset: 0;
        background: rgba(2,6,23,0.9);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
    }

    .viewer.active {
        display: flex;
    }

    .viewer img {
        max-width: 85%;
        max-height: 85%;
        border-radius: 16px;
        animation: zoomIn 0.4s ease;
        box-shadow: 0 0 60px rgba(56,189,248,0.4);
    }

    .close-btn {
        position: absolute;
        top: 25px;
        right: 30px;
        font-size: 32px;
        color: #fff;
        cursor: pointer;
        user-select: none;
    }

    @keyframes zoomIn {
        from {
            transform: scale(0.6);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }
</style>
</head>

<body>

<div class="vault">
    <h1>IMAGE GALLERY</h1>

    <div class="frame-grid">
        <div class="frame" data-img="https://picsum.photos/id/1015/900/600">
            <img src="https://picsum.photos/id/1015/400/300">
            <span class="tag">Mountains</span>
        </div>

        <div class="frame" data-img="https://picsum.photos/id/1025/900/600">
            <img src="https://picsum.photos/id/1025/400/300">
            <span class="tag">Wildlife</span>
        </div>

        <div class="frame" data-img="https://picsum.photos/id/1039/900/600">
            <img src="https://picsum.photos/id/1039/400/300">
            <span class="tag">Desert</span>
        </div>

        <div class="frame" data-img="https://picsum.photos/id/1043/900/600">
            <img src="https://picsum.photos/id/1043/400/300">
            <span class="tag">Ocean</span>
        </div>

        <div class="frame" data-img="https://picsum.photos/id/1069/900/600">
            <img src="https://picsum.photos/id/1069/400/300">
            <span class="tag">Forest</span>
        </div>

        <div class="frame" data-img="https://picsum.photos/id/1074/900/600">
            <img src="https://picsum.photos/id/1074/400/300">
            <span class="tag">City</span>
        </div>
    </div>
</div>

<!-- Lightbox -->
<div class="viewer" id="viewerBox">
    <span class="close-btn" onclick="closeViewer()">✕</span>
    <img id="viewerImg">
</div>

<script>
    const frames = document.querySelectorAll(".frame");
    const viewer = document.getElementById("viewerBox");
    const viewerImg = document.getElementById("viewerImg");

    frames.forEach(frame => {
        frame.addEventListener("click", () => {
            const imgSrc = frame.getAttribute("data-img");
            viewerImg.src = imgSrc;
            viewer.classList.add("active");
        });
    });

    function closeViewer() {
        viewer.classList.remove("active");
        viewerImg.src = "";
    }

    // Close on background click
    viewer.addEventListener("click", (e) => {
        if (e.target === viewer) {
            closeViewer();
        }
    });
</script>

</body>
</html>
