<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s;
        }

        .calc-box {
            background: #2c2c2c;
            padding: 25px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: background 0.3s;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .screen {
            width: 100%;
            height: 55px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 8px;
            border: none;
            background: #f0f0f0;
            color: #333;
            transition: background 0.3s, color 0.3s;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        button {
            height: 48px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .num {
            background: #e0e0e0;
            color: #333;
        }

        .op {
            background: #ff9800;
            color: white;
        }

        .clear {
            background: #f44336;
            color: white;
        }

        .equals {
            background: #4caf50;
            color: white;
            grid-column: span 2;
        }

        .sci {
            background: #9c27b0;
            color: white;
        }

        .mem {
            background: #2196f3;
            color: white;
        }

        /* Light theme */
        body.light {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .calc-box.light {
            background: #f5f5f5;
        }

        .screen.light {
            background: #fff;
            color: #000;
        }

        .num.light {
            background: #d0d0d0;
            color: #000;
        }
    </style>
</head>
<body class="dark">
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    <div class="calc-box" id="calc-box">
        <input type="text" id="screen" class="screen" readonly>
        <div class="keys">
            <button class="clear" onclick="resetCalc()">AC</button>
            <button class="mem" onclick="memoryClear()">MC</button>
            <button class="mem" onclick="memoryRecall()">MR</button>
            <button class="mem" onclick="memoryStore()">MS</button>
            <button class="mem" onclick="memoryAdd()">M+</button>

            <button class="sci" onclick="add('Math.sin(')">sin</button>
            <button class="sci" onclick="add('Math.cos(')">cos</button>
            <button class="sci" onclick="add('Math.tan(')">tan</button>
            <button class="sci" onclick="add('Math.log10(')">log</button>
            <button class="sci" onclick="add('Math.sqrt(')">√</button>

            <button class="op" onclick="add('/')">÷</button>
            <button class="op" onclick="add('*')">×</button>
            <button class="op" onclick="add('-')">−</button>
            <button class="op" onclick="add('+')">+</button>
            <button class="op" onclick="add('**')">^</button>

            <button class="num" onclick="add('7')">7</button>
            <button class="num" onclick="add('8')">8</button>
            <button class="num" onclick="add('9')">9</button>
            <button class="op" onclick="add('(')">(</button>
            <button class="op" onclick="add(')')">)</button>

            <button class="num" onclick="add('4')">4</button>
            <button class="num" onclick="add('5')">5</button>
            <button class="num" onclick="add('6')">6</button>
            <button class="sci" onclick="add('Math.PI')">π</button>
            <button class="sci" onclick="add('Math.E')">e</button>

            <button class="num" onclick="add('1')">1</button>
            <button class="num" onclick="add('2')">2</button>
            <button class="num" onclick="add('3')">3</button>
            <button class="equals" onclick="result()">=</button>

            <button class="num" onclick="add('0')">0</button>
            <button class="num" onclick="add('.')">.</button>
            <button class="clear" onclick="backspace()">⌫</button>
        </div>
    </div>

    <script>
        let memory = 0;
        let theme = 'dark';

        function add(value) {
            document.getElementById("screen").value += value;
        }

        function resetCalc() {
            document.getElementById("screen").value = "";
        }

        function backspace() {
            let screen = document.getElementById("screen");
            screen.value = screen.value.slice(0, -1);
        }

        function result() {
            let exp = document.getElementById("screen").value;
            try {
                let result = Function("return " + exp)();
                document.getElementById("screen").value = result;
            } catch {
                alert("Error! Invalid input");
                resetCalc();
            }
        }

        function memoryClear() {
            memory = 0;
        }

        function memoryRecall() {
            document.getElementById("screen").value += memory;
        }

        function memoryStore() {
            let screen = document.getElementById("screen");
            memory = parseFloat(screen.value) || 0;
        }

        function memoryAdd() {
            let screen = document.getElementById("screen");
            memory += parseFloat(screen.value) || 0;
        }

        function toggleTheme() {
            const body = document.body;
            const calcBox = document.getElementById('calc-box');
            const screen = document.getElementById('screen');
            const toggleBtn = document.querySelector('.theme-toggle');
            const nums = document.querySelectorAll('.num');

            if (theme === 'dark') {
                body.classList.add('light');
                calcBox.classList.add('light');
                screen.classList.add('light');
                nums.forEach(btn => btn.classList.add('light'));
                toggleBtn.textContent = '☀️';
                theme = 'light';
            } else {
                body.classList.remove('light');
                calcBox.classList.remove('light');
                screen.classList.remove('light');
                nums.forEach(btn => btn.classList.remove('light'));
                toggleBtn.textContent = '🌙';
                theme = 'dark';
            }
        }
    </script>
</body>
</html>
